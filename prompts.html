<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';">

<meta name="description" content="AI prompts and architecture behind projects by Alwin Madhu">
<meta name="author" content="Alwin Madhu">
<link rel="canonical" href="https://alwin-m.github.io/Portfolio/prompts.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

<title>AI Prompts — Alwin Madhu</title>
  <style>
:root{--w:#ffffff;--ow:#f7f7f5;--blk:#090909;--g1:#f0f0ee;--g2:#e2e2df;--g4:#9e9e98;--g6:#696963;--g8:#2a2a26;--f:'Inter',system-ui,sans-serif;--m:'DM Mono',monospace;--e:cubic-bezier(0.16,1,0.3,1);}    
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;font-size:16px;}
body{font-family:var(--f);background:var(--w);color:var(--blk);line-height:1;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
img{display:block;max-width:100%;}

nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:28px 60px;}
.logo{font-size:12px;font-weight:300;letter-spacing:.1em;text-transform:uppercase;color:var(--blk);text-decoration:none;}

.ph{padding:160px 60px 96px;border-bottom:1px solid var(--g2);}
.phl{font-family:var(--m);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--g4);margin-bottom:32px;}
.pht{font-size:clamp(52px,9vw,120px);font-weight:100;letter-spacing:-.055em;line-height:.88;color:var(--blk);}  

.ps{padding:0 60px 140px;}
.pg{display:grid;grid-template-columns:1fr;gap:2px;background:var(--g2);border:1px solid var(--g2);margin-top:80px;}

.pc{background:var(--w);padding:52px 48px;transition:background .35s var(--e);}    
.pc:hover{background:var(--ow);}    

.ptitle{font-size:28px;font-weight:200;margin-bottom:16px;}
.pdesc{font-size:13px;line-height:1.7;color:var(--g6);margin-bottom:24px;}

.jsonbox{
background:#0e0e0e;
color:#e8e8e8;
padding:24px;
border-radius:2px;
font-family:var(--m);
font-size:11px;
overflow:auto;
margin-bottom:20px;
line-height:1.6;
}

.copy{
border:1px solid var(--g2);
background:transparent;
padding:10px 16px;
font-size:10px;
letter-spacing:.12em;
text-transform:uppercase;
cursor:pointer;
transition:.3s;
}

.copy:hover{
background:var(--blk);
color:#fff;
}

footer{border-top:1px solid var(--g2);padding:36px 60px;text-align:center;font-size:11px;color:var(--g4);}    

@media(max-width:960px){
.ph{padding:130px 32px 72px;}
.ps{padding:0 32px 100px;}
}
</style>
</head>

<body>
